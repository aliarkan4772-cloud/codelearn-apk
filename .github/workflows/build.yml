name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless zip unzip autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev libltdl-dev gettext cmake ccache
          pip install --upgrade pip wheel
          pip install "cython<3.0" buildozer
      - uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
      - name: Build APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: CodeLearn-APK
          path: bin/*.apk
